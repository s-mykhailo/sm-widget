def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

plugins { id 'com.android.application' }
android {
    namespace 'com.sm.widget'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sm.widget'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    dependenciesInfo { includeInApk false; includeInBundle false }
    lint { abortOnError false; checkReleaseBuilds false }
}
